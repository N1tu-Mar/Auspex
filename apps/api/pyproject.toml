[project]
name = "auspex-api"
version = "0.1.0"
description = "Auspex FastAPI application."
requires-python = ">=3.12"
dependencies = [
    "auspex-contracts",
    "alembic>=1.14",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
]

[tool.uv.sources]
auspex-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
