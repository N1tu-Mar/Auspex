[project]
name = "auspex-contracts"
version = "0.1.0"
description = "Authoritative Auspex domain contracts (Pydantic)."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auspex_contracts"]
