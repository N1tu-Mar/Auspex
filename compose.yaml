# One command: docker compose up --build
# Defaults are local-only fakes; override via .env (see .env.example).
name: auspex

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_local_only}
  POSTGRES_DB: ${POSTGRES_DB:-auspex}
  APP_DB_USER: ${APP_DB_USER:-auspex_app}
  APP_DB_PASSWORD: ${APP_DB_PASSWORD:-auspex_app_local_only}

services:
  db:
    image: postgres:17-alpine
    environment:
      <<: *db-env
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432" # localhost only, never public
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/init-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      retries: 30

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-auspex_app}:${APP_DB_PASSWORD:-auspex_app_local_only}@db:5432/${POSTGRES_DB:-auspex}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 2s
      retries: 30

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
