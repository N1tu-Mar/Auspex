[project]
name = "auspex-sports"
version = "0.1.0"
description = "Auspex SportAdapter contract and per-sport coverage boundaries."
requires-python = ">=3.12"
dependencies = ["auspex-contracts", "auspex-prediction"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auspex_sports"]
