[project]
name = "auspex-prediction"
version = "0.1.0"
description = "Deterministic Auspex probability, EV, de-vig, and combo primitives."
requires-python = ">=3.12"
dependencies = ["auspex-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auspex_prediction"]
