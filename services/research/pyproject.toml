[project]
name = "auspex-research"
version = "0.1.0"
description = "Auspex read-only provider adapters and immutable evidence snapshots."
requires-python = ">=3.12"
dependencies = ["auspex-contracts", "httpx>=0.28", "pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auspex_research"]
