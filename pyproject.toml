[tool.uv.workspace]
members = [
    "apps/api",
    "packages/contracts",
    "services/prediction",
    "services/research",
    "services/sports",
]

[dependency-groups]
dev = [
    "auspex-api",
    "auspex-contracts",
    "auspex-prediction",
    "auspex-research",
    "auspex-sports",
    "httpx2>=2.13",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv.sources]
auspex-api = { workspace = true }
auspex-contracts = { workspace = true }
auspex-prediction = { workspace = true }
auspex-research = { workspace = true }
auspex-sports = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["packages/contracts/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DTZ", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = [
    "app",
    "auspex_contracts",
    "auspex_prediction",
    "auspex_research",
    "auspex_sports",
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = [
    "apps/api",
    "packages/contracts",
    "database/migrations",
    "database/tests",
    "services/prediction",
    "services/research",
    "services/sports",
]
mypy_path = "apps/api:packages/contracts:services/prediction:services/research:services/sports"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = [
    "apps/api/tests",
    "database/tests",
    "packages/contracts/tests",
    "services/prediction/tests",
    "services/research/tests",
    "services/sports/tests",
]
markers = ["db: requires a running PostgreSQL (pnpm test:db)"]
addopts = "--import-mode=importlib"
filterwarnings = ["ignore::DeprecationWarning:starlette.testclient"]
